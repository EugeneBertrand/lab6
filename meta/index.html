<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta Analysis</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Codebase Metrics</h1>
        <p>
          A quick look at the codebase over time, including commit timing, summary
          statistics, and the distribution of work by language.
        </p>
      </header>

      <section>
        <h2>Summary</h2>
        <div id="stats"></div>
      </section>

      <section>
        <h2>Commits by time of day</h2>
        <div id="chart"></div>
      </section>

      <section>
        <h2>Selected commits</h2>
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </section>
    </main>

    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd><a href="" id="commit-link" target="_blank"></a></dd>
      <dt>Date</dt>
      <dd id="commit-date"></dd>
      <dt>Author</dt>
      <dd id="commit-author"></dd>
      <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
    </dl>

    <script type="module" src="./main.js"></script>
  </body>
</html>
